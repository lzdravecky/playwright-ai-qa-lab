name: Playwright Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  regression:
    # Disabled temporarily while Docker regression is the primary CI job.
    if: false
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Playwright repository
        uses: actions/checkout@v7

      - name: Checkout QA Shop
        uses: actions/checkout@v7
        with:
          repository: lzdravecky/qa-shop
          path: qa-shop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  smoke:
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Playwright repository
        uses: actions/checkout@v7

      - name: Checkout QA Shop
        uses: actions/checkout@v7
        with:
          repository: lzdravecky/qa-shop
          path: qa-shop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests
        run: npx playwright test --grep @smoke --project=chromium

      - name: Upload Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 30

  docker-regression:
    timeout-minutes: 60
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Playwright repository
        uses: actions/checkout@v7

      - name: Checkout QA Shop for Docker Compose
        run: git clone --depth 1 https://github.com/lzdravecky/qa-shop.git ../qa-shop

      - name: Run regression tests in Docker Compose
        run: docker compose run --build --rm -e CI=true playwright npx playwright test

      - name: Upload report for GitHub Pages
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v4
        with:
          path: playwright-report/

      - name: Upload Docker Playwright report
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: docker-playwright-report
          path: playwright-report/
          retention-days: 30

  deploy-report:
    if: github.event_name == 'push'
    needs: docker-regression
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy Playwright report to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
